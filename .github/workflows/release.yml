name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_bump:
        description: 版本号迭代方式
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 计算并提交版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(jq -r '.version' package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUMP_TYPE="${{ github.event.inputs.version_bump }}"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if grep -qE 'BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:' <<< "$COMMIT_MSG"; then
              BUMP_TYPE=major
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$COMMIT_MSG"; then
              BUMP_TYPE=minor
            else
              BUMP_TYPE=patch
            fi
          fi

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TEMP_JSON=$(mktemp)
          jq --arg version "$NEW_VERSION" '.version = $version' package.json > "$TEMP_JSON"
          mv "$TEMP_JSON" package.json
          sed -i '/^name = "bilibili-account-manager"$/ { n; s/^version = ".*"$/version = "'"$NEW_VERSION"'"/; }' src-tauri/Cargo.lock
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${NEW_VERSION}\"/" src-tauri/Cargo.toml

          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): 发布 v${NEW_VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          git tag -a "v${NEW_VERSION}" -m "BiliAssist v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 生成变更日志
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## 更新内容"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## 下载说明"
            echo
            echo "下载与系统对应的压缩包，解压后运行 BiliAssist。"
          } > changelog.md

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libfontconfig-dev libglib2.0-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev

      - name: 构建原生应用
        shell: bash
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: 打包 Windows 程序
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp src-tauri/target/release/bilibili-account-manager.exe dist/package/BiliAssist.exe
          7z a "dist/biliassist-${VERSION}-windows-x86_64.zip" ./dist/package/BiliAssist.exe

      - name: 打包 Unix 程序
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp src-tauri/target/release/bilibili-account-manager dist/package/BiliAssist
          chmod +x dist/package/BiliAssist
          OS_NAME=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          tar -C dist/package -czf "dist/biliassist-${VERSION}-${OS_NAME}-${ARCH}.tar.gz" BiliAssist

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact }}
          path: dist/biliassist-*
          if-no-files-found: error

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: release

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release/assets
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file release/changelog.md --repo "${{ github.repository }}"
          else
            gh release create "$TAG_NAME" --title "BiliAssist $TAG_NAME" --notes-file release/changelog.md --repo "${{ github.repository }}"
          fi
          gh release upload "$TAG_NAME" release/assets/* --clobber --repo "${{ github.repository }}"
