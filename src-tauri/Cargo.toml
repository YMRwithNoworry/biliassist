[package]
name = "bilibili-account-manager"
version = "0.12.0"
description = "Bilibili Account Manager"
authors = ["YMRwithNoworry"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YMRwithNoworry/biliassist"

[lib]
name = "bilibili_account_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 提供窗口、托盘和 IPC command 边界；前端是 React（见仓库根目录 src/）。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "json", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["full"] }
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.10"
aes-gcm = "0.10"
rand = "0.8"
md-5 = "0.10"
async-trait = "0.1"

[features]
# 生产构建必须开启：tauri-macros 用 cfg!(not(feature = "custom-protocol")) 判断开发/生产，
# 未开启时生成的 Context 不内嵌 dist，窗口会去加载 build.devUrl（http://localhost:1420）。
custom-protocol = ["tauri/custom-protocol"]
