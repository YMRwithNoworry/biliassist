[package]
name = "bilibili-account-manager"
version = "0.11.0"
description = "Bilibili Account Manager"
authors = ["YMRwithNoworry"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YMRwithNoworry/biliassist"

[lib]
name = "bilibili_account_manager_lib"
crate-type = ["rlib"]

[dependencies]
# GPUI Kit 统一提供 GPUI（gpui-pre）、组件库（gpui-component）、基础层（gpui-base）和默认图标资源。
# gpui-kit 的默认特性已启用 component 与 assets，并附带 font-kit 字体后端。
gpui-kit = "0.6.4"
async-channel = "2"
auto-launch = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "json", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["full"] }
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.10"
aes-gcm = "0.10"
rand = "0.8"
md-5 = "0.10"
async-trait = "0.1"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
