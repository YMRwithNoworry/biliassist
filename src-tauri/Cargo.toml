[package]
name = "bilibili-account-manager"
version = "0.7.16"
description = "Bilibili Account Manager"
authors = ["YMRwithNoworry"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YMRwithNoworry/biliassist"

[lib]
name = "bilibili_account_manager_lib"
crate-type = ["rlib"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bd833291311289f3468479d31b629d3de279d3d4" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bd833291311289f3468479d31b629d3de279d3d4" }
async-channel = "2"
auto-launch = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "json", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["full"] }
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.10"
aes-gcm = "0.10"
rand = "0.8"
md-5 = "0.10"
async-trait = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
